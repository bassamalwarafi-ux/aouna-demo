<style>
/* Layout: sticky top bar + role sidebar (start edge) + work area; collapses to a horizontal tab strip on phones.
   Identity follows the Aouna partnership deck: deep navy ground, emerald action color, gold reserved for "selected / money" moments. */
:root{
  --bg:#0A1628; --surface:#0F2138; --surface-2:#14294A; --line:#1F3B5E; --line-soft:#182F4D;
  --fg:#E7EEF6; --muted:#90A4BC; --faint:#5F7591;
  --accent:#12B886; --accent-ink:#5EEAD4; --accent-soft:rgba(18,184,134,.14); --on-accent:#03241A;
  --gold:#D4B05A; --gold-soft:rgba(212,176,90,.14);
  --ok:#34D399; --ok-soft:rgba(52,211,153,.14);
  --warn:#F5B84C; --warn-soft:rgba(245,184,76,.14);
  --bad:#F87171; --bad-soft:rgba(248,113,113,.14);
  --info:#86A8F2; --info-soft:rgba(134,168,242,.14);
  --shadow:0 18px 40px -18px rgba(0,0,0,.6);
  --f-display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#E9EFF5; --line:#D3DDE8; --line-soft:#E3EAF1;
  --fg:#0B1A2E; --muted:#52657B; --faint:#8395AA;
  --accent:#0A8F68; --accent-ink:#0B6E58; --accent-soft:rgba(10,143,104,.10); --on-accent:#FFFFFF;
  --gold:#9A7517; --gold-soft:rgba(154,117,23,.10);
  --ok:#0E8A5C; --ok-soft:rgba(14,138,92,.10);
  --warn:#A8650A; --warn-soft:rgba(168,101,10,.10);
  --bad:#C0392B; --bad-soft:rgba(192,57,43,.09);
  --info:#2F5FC4; --info-soft:rgba(47,95,196,.09);
  --shadow:0 18px 40px -22px rgba(11,26,46,.35);
  color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#E9EFF5; --line:#D3DDE8; --line-soft:#E3EAF1;
  --fg:#0B1A2E; --muted:#52657B; --faint:#8395AA;
  --accent:#0A8F68; --accent-ink:#0B6E58; --accent-soft:rgba(10,143,104,.10); --on-accent:#FFFFFF;
  --gold:#9A7517; --gold-soft:rgba(154,117,23,.10);
  --ok:#0E8A5C; --ok-soft:rgba(14,138,92,.10);
  --warn:#A8650A; --warn-soft:rgba(168,101,10,.10);
  --bad:#C0392B; --bad-soft:rgba(192,57,43,.09);
  --info:#2F5FC4; --info-soft:rgba(47,95,196,.09);
  --shadow:0 18px 40px -22px rgba(11,26,46,.35);
  color-scheme:light; }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.3;margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:6px}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:.01em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);background:none;border:0;padding:0;cursor:pointer}
.brand-mark{width:34px;height:34px}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;line-height:1}
.brand-tag{font-size:11px;color:var(--muted);display:block;margin-top:3px}
.demo-flag{font-size:11.5px;color:var(--gold);background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);padding:3px 9px;border-radius:99px;white-space:nowrap}
.tb-spacer{flex:1}
.tb-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.persona{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px}
[dir="rtl"] .persona{padding:3px 12px 3px 4px}
.persona label{font-size:12px;color:var(--muted);white-space:nowrap}
.persona select{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13.5px;max-width:230px}
.icon-btn{position:relative;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:13px;white-space:nowrap}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.dot-count{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:600}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{border-inline-end:1px solid var(--line);background:var(--surface);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.side-who{padding:6px 10px 14px;border-bottom:1px solid var(--line-soft);margin-bottom:8px}
.side-who b{display:block;font-family:var(--f-display);font-weight:600;font-size:14.5px}
.side-who span{font-size:12.5px;color:var(--muted)}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:9px 10px;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:14.5px}
.nav-btn:hover{background:var(--surface-2);color:var(--fg)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-btn .tag{margin-inline-start:auto;font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--gold-soft);color:var(--gold);font-weight:500}
.side-foot{margin-top:auto;padding:12px 10px 0;font-size:12px;color:var(--faint);border-top:1px solid var(--line-soft)}
main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:26px 60px}
.page{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:clamp(22px,2.6vw,28px)}
.page-head p{color:var(--muted);margin-top:4px;max-width:62ch}
.crumb{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:6px}
.crumb button{background:none;border:0;color:var(--accent-ink);cursor:pointer;padding:0}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;overflow-x:auto;border-inline-end:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));gap:4px;scrollbar-width:none}
  .side-who,.side-foot{display:none}
  .nav-btn{width:auto;white-space:nowrap;flex:none;padding:8px 11px}
  .persona label{display:none}
  .tb-hide-sm{display:none}
}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2,.card-h h3{font-size:16.5px}
.sub{font-size:13px;color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid transparent;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none}
.btn-p{background:var(--accent);color:var(--on-accent)}
.btn-p:hover{filter:brightness(1.08)}
.btn-g{background:transparent;border-color:var(--line);color:var(--fg)}
.btn-g:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn-gold{background:var(--gold);color:#1B1405}
.btn-d{background:transparent;border-color:color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad)}
.btn-d:hover{background:var(--bad-soft)}
.btn-sm{min-height:32px;padding:0 11px;font-size:13px;font-weight:500}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.link{background:none;border:0;color:var(--accent-ink);cursor:pointer;padding:0;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 10px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-n{background:var(--surface-2);color:var(--muted)}
.t-i{background:var(--info-soft);color:var(--info)}
.t-a{background:var(--accent-soft);color:var(--accent-ink)}
.t-g{background:var(--gold-soft);color:var(--gold)}
.t-s{background:var(--ok-soft);color:var(--ok)}
.t-w{background:var(--warn-soft);color:var(--warn)}
.t-d{background:var(--bad-soft);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:6px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line-soft)}
.chip.on{background:var(--accent-soft);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
button.chip{cursor:pointer;font-size:13px;padding:6px 11px}
.spec{display:none;font-family:var(--f-mono);font-size:11px;color:var(--gold);background:var(--gold-soft);border:1px dashed color-mix(in srgb,var(--gold) 50%,transparent);border-radius:5px;padding:1px 7px;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.show-spec .spec{display:inline-block}
.notice{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2);font-size:14px}
.notice .ic{margin-top:3px}
.notice.ok{border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)}
.notice.warn{border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft)}
.notice.gold{border-color:color-mix(in srgb,var(--gold) 40%,transparent);background:var(--gold-soft)}
.notice.bad{border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:var(--bad-soft)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .d{font-size:12px;color:var(--faint);margin-top:2px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:start;padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover td{background:var(--surface-2)}
td .t1{font-weight:500}
td .t2{font-size:12.5px;color:var(--muted)}

/* forms */
.form{display:grid;gap:16px}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:13px;font-weight:500}
.field .hint{font-size:12px;color:var(--faint)}
.field .err{font-size:12.5px;color:var(--bad)}
input[type=text],input[type=tel],input[type=email],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14.5px;min-height:42px}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.invalid{border-color:var(--bad)!important}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent);flex:none}
.drop{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--bg);flex-wrap:wrap}
.drop.done{border-style:solid;border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--ok-soft)}
.drop .grow{flex:1;min-width:160px}
.drop input[type=file]{font-size:12.5px;max-width:100%}

/* stepper (application wizard) */
.stepper{display:flex;gap:6px;counter-reset:s;overflow-x:auto;padding-bottom:2px}
.stepper li{list-style:none;flex:1;min-width:112px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--faint)}
.stepper li::before{content:"";height:4px;border-radius:2px;background:var(--line)}
.stepper li.done{color:var(--muted)} .stepper li.done::before{background:var(--accent)}
.stepper li.cur{color:var(--fg);font-weight:600} .stepper li.cur::before{background:var(--accent-ink)}
.stepper{margin:0;padding:0}

/* status track */
.track{display:flex;gap:0;overflow-x:auto;padding:4px 0 2px}
.track .st{flex:1;min-width:96px;position:relative;font-size:12px;color:var(--faint);padding-top:22px;text-align:center}
.track .st::before{content:"";position:absolute;top:6px;inset-inline:0;height:2px;background:var(--line)}
.track .st::after{content:"";position:absolute;top:1px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.track .st.done{color:var(--muted)} .track .st.done::before{background:var(--accent)} .track .st.done::after{background:var(--accent);border-color:var(--accent)}
.track .st.cur{color:var(--fg);font-weight:600} .track .st.cur::after{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.track .st.bad{color:var(--bad)} .track .st.bad::after{background:var(--bad);border-color:var(--bad)}

/* offers comparison */
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.offer{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.offer.best{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.offer.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.offer.dim{opacity:.55}
.offer-h{padding:14px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:8px}
.offer-h b{font-family:var(--f-display);font-size:15px}
.offer-inst{font-size:12.5px;color:var(--muted)}
.offer-big{padding:14px 16px 6px}
.offer-big .lbl{font-size:12px;color:var(--muted)}
.offer-big .val{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.offer-tags{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px;min-height:30px}
dl.kv{margin:0;padding:4px 16px 12px;display:grid;grid-template-columns:auto 1fr;gap:0}
dl.kv dt,dl.kv dd{padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;text-align:end;font-variant-numeric:tabular-nums;font-weight:500}
dl.kv dt:nth-last-child(2),dl.kv dd:last-child{border-bottom:0}
.offer-f{margin-top:auto;padding:12px 16px 16px}
.offer-f .btn{width:100%}

/* hero (public) */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:36px;align-items:center;padding-block:18px 8px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.eyebrow{font-size:12.5px;color:var(--accent-ink);font-weight:600;letter-spacing:.02em}
.hero h1{font-size:clamp(36px,6vw,62px);font-weight:700;letter-spacing:-.015em;margin-top:10px;line-height:1.15}
.hero h1 em{font-style:normal;color:var(--accent-ink)}
.lede{font-size:17px;color:var(--muted);margin-top:16px;max-width:52ch}
.hero .row{margin-top:24px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.mini-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}

.mini-f{padding:12px 18px;background:var(--surface-2);font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}

.steps5 .n{font-family:var(--f-mono);font-size:12px;color:var(--gold)}
.steps5 h3{font-size:15px;margin-top:6px}
.steps5 p{font-size:13px;color:var(--muted);margin-top:6px}
.who-card h3{font-size:17px;margin-top:10px}
.who-card ul{margin:12px 0 0;padding-inline-start:18px;color:var(--muted);font-size:14px;display:grid;gap:4px}

.foot{display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}
.foot .sel{user-select:all;direction:ltr;unicode-bidi:isolate}

.bars svg{width:100%;height:auto;display:block}
.bars text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.bars .gl{stroke:var(--line-soft)}
.bars .b{fill:var(--accent)}
.bars .b.last{fill:var(--gold)}

/* list rows */
.lrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.lrow:last-child{border-bottom:0}
.lrow .grow{flex:1;min-width:0}

.evlog .okc{color:var(--ok)} .evlog .bad{color:var(--bad)} .evlog .wc{color:var(--warn)}

.modal-h h2{font-size:17px}

.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.x{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px}
.checks{display:grid;gap:8px}
.checks div{display:flex;gap:10px;align-items:center;font-size:14px;animation:pop .35s ease both}
.checks div .ic{color:var(--ok)}
@keyframes pop{from{transform:translateY(4px)}to{transform:none}}
.toasts{position:fixed;z-index:70;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--surface);border:1px solid var(--line);border-inline-start:3px solid var(--accent);border-radius:8px;padding:11px 14px;box-shadow:var(--shadow);font-size:14px}
.toast.bad{border-inline-start-color:var(--bad)} .toast.gold{border-inline-start-color:var(--gold)}
.guide li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.guide li:last-child{border-bottom:0}
.guide ol{margin:0;padding:0;list-style:none}
.guide .n{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.guide .n.ok{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.guide .grow{flex:1;min-width:0}

.hero-wrap{position:relative;isolation:isolate;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.slides{position:absolute;inset:0;z-index:-2}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.slide.on{opacity:1}
.slide svg{width:100%;height:100%;display:block}
.slide.on svg{animation:kb 16s ease-in-out infinite alternate;transform-origin:60% 60%}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.hero-wrap::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to left,var(--bg) 0%,color-mix(in srgb,var(--bg) 84%,transparent) 38%,color-mix(in srgb,var(--bg) 25%,transparent) 72%,transparent 100%)}
[dir="ltr"] .hero-wrap::before{background:linear-gradient(to right,var(--bg) 0%,color-mix(in srgb,var(--bg) 84%,transparent) 38%,color-mix(in srgb,var(--bg) 25%,transparent) 72%,transparent 100%)}
.hero-wrap .hero{padding:44px clamp(20px,4vw,52px) 72px}
.slide-ctl{position:absolute;bottom:18px;inset-inline-start:clamp(20px,4vw,52px);display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:calc(100% - 40px)}
.dots{display:flex;gap:6px}
.dots button{width:26px;height:6px;border-radius:3px;border:0;padding:0;cursor:pointer;background:color-mix(in srgb,var(--fg) 25%,transparent)}
.dots button[aria-current="true"]{background:var(--accent-ink)}
.slide-cap{font-size:12.5px;color:var(--fg);background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--line);padding:3px 10px;border-radius:99px;backdrop-filter:blur(4px)}
.slide-cap small{color:var(--muted);margin-inline-start:6px}
@media (max-width:900px){
  .slides{bottom:auto;height:230px}
  .hero-wrap::before,[dir="ltr"] .hero-wrap::before{bottom:auto;height:230px;background:linear-gradient(to bottom,transparent 50%,var(--surface) 100%)}
  .hero-wrap .hero{padding-top:214px}
  .slide-ctl{bottom:auto;top:18px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

function postSeed(s){
  s.apps.forEach(a=>{ a.zone=GOV_ZONE[a.gov]; });
  s.offers.forEach(o=>{ o.pay=Math.round(legacyInst(o)/100)*100; o.mlabel=METHOD[o.method]; });
  const lims={I1:{old:[100000,2700000],new:[300000,8000000]},I2:{old:[70000,3300000],new:[200000,10000000]},I3:{old:[35000,1700000],new:[100000,5000000]},I4:{old:[170000,6700000],new:[500000,20000000]},I5:{new:[100000,3000000]}};
  s.institutions.forEach(i=>{ i.policy.lim=lims[i.id]; i.policy.zones=Object.keys(lims[i.id]); });
  s.invoices.forEach(v=>{ v.zone=v.zone||"new"; });
  s.notifs.forEach((n,i)=>{ n.ch=i===3?"sms":"wa"; n.fb=i===3; });
  s.msgs=s.notifs.map((n,i)=>({id:"M-"+(10450+i),to:n.to,t:n.t,ch:n.ch,fb:n.fb,at:n.at,status:"DELIVERED",cost:n.fb?55:20}));
  return s;
}
function load(){ try{ const r=localStorage.getItem(KEY); if(r){ const o=JSON.parse(r); if(o && o.apps) return o; } }catch(e){} return seed(); }
function save(){ try{ const c=Object.assign({},S); delete c.modal; localStorage.setItem(KEY,JSON.stringify(c)); }catch(e){} }

/* ================================================================
   "Server" layer — authorization + transitions + money math.
   In production every function here is a server endpoint wrapped in a
   DB transaction, with an audit_event written after commit (§7.2-6).
   ================================================================ */
const ACTOR = () => ({beneficiary:"أمل الحمادي",officer:"خالد العبسي",manager:"فؤاد الكبسي",kyc:"ريم الصبري",admin:"إدارة عُونة",visitor:"visitor"})[S.role];
function audit(action,entity,from,to,reason,role){ S.audit.unshift({at:nowISO(),actor:role==="system"?"system":ACTOR(),role:role||S.role,action,entity,from:from||"—",to:to||"—",reason:reason||"",corr:"c-"+Math.random().toString(16).slice(2,6)}); }
/* v2.1 §5 — every in-app notification is also sent by WhatsApp, falling back to SMS */
const CH={wa:["واتساب","WhatsApp"],sms:["رسالة SMS","SMS"]};
const MSG_COST={wa:20,sms:35}; /* example cost per message, YER new notes */
function sendMsg(to,t,force){ const pref=force||(S.prefs&&S.prefs[to])||"wa"; let ch=pref, fb=false; if(pref==="wa" && Math.random()<0.12){ ch="sms"; fb=true; }
  const m={id:rid("M-",5),to,t,ch,fb,at:nowISO(),status:"DELIVERED",cost:MSG_COST[ch]+(fb?MSG_COST.wa:0)}; (S.msgs=S.msgs||[]).unshift(m); return m; }
function notify(to,t){ const m=sendMsg(to,t); S.notifs.unshift({to,t,at:nowISO(),read:false,ch:m.ch,fb:m.fb}); }

const APP_FLOW = {DRAFT:["SUBMITTED","CANCELLED"],SUBMITTED:["NEEDS_INFO","ELIGIBLE","REJECTED_AT_INTAKE"],NEEDS_INFO:["SUBMITTED","CANCELLED"],ELIGIBLE:["PUBLISHED"],PUBLISHED:["OFFER_RECEIVED","EXPIRED","CANCELLED"],OFFER_RECEIVED:["OFFER_SELECTED","PUBLISHED","CANCELLED"],OFFER_SELECTED:["PRE_DISBURSEMENT","DECLINED_AFTER_SELECTION"],PRE_DISBURSEMENT:["FUNDED","DECLINED_AFTER_SELECTION"],FUNDED:["CLOSED"]};
function move(a,to,reason,role){ const ok=(APP_FLOW[a.status]||[]).includes(to); if(!ok){ throw new Error(L(`انتقال غير مسموح: ${a.status} → ${to}`,`Transition not allowed: ${a.status} → ${to}`)); } const from=a.status; a.status=to; audit("application.transition",a.ref,from,to,reason,role); }

/* §3.3 — comparison indicators computed server-side from stored values */
/* v2.1: each lender computes the instalment its own way; the platform only adds up what was declared */
function quote(o){ const n=Math.max(1,(+o.term)-(+o.grace||0)); const pay=+o.pay||0; const fees=+o.fees||0; const paid=pay*n+fees; return {inst:pay, n, paid, cost:paid-(+o.amount)}; }
/* used only to seed sample offers */
function legacyInst(o){ const P=+o.amount, n=Math.max(1,(+o.term)-(+o.grace||0)); if(o.method==="murabaha"){ return (P+P*(+o.rate/100)*(+o.term/12))/n; } const r=(+o.rate/100)/12; const Pg=P*Math.pow(1+r,+o.grace||0); return r===0?Pg/n:Pg*r/(1-Math.pow(1+r,-n)); }
function matches(a,i){ const p=i.policy; const lm=p.lim&&p.lim[a.zone]; return i.status==="ACTIVE" && !!lm && p.govs.includes(a.gov) && p.secs.includes(a.sector) && a.amount>=lm[0] && a.amount<=lm[1]; }

/* ABAC: an institution sees only matched, live requests — never identity before selection */
function officerCanSee(a){ const I1=inst("I1"); const mine=S.offers.find(o=>o.app===a.id&&o.inst==="I1"); return (["PUBLISHED","OFFER_RECEIVED"].includes(a.status) && matches(a,I1)) || !!mine; }

function srvSelectOffer(offerId){
  const o=S.offers.find(x=>x.id===offerId); const a=app(o.app);
  if(a.owner!=="me") throw new Error("403");
  if(a.status!=="OFFER_RECEIVED") throw new Error(L("لا يمكن الاختيار في هذه الحالة","Cannot select in this state"));
  if(S.offers.some(x=>x.app===a.id && x.status==="SELECTED")) throw new Error(L("يوجد عرض مختار مسبقاً (قيد UNIQUE)","An offer is already selected (UNIQUE)"));
  if(daysLeft(o.expires)<0) throw new Error(L("انتهت صلاحية العرض","Offer expired"));
  // atomic block
  o.status="SELECTED";
  S.offers.filter(x=>x.app===a.id && x.id!==o.id && ["SUBMITTED","VIEWED"].includes(x.status)).forEach(x=>{ x.status="DECLINED"; audit("offer.auto_close",`Offer ${x.id}`,"SUBMITTED","DECLINED","competitor selected","system"); notify(x.inst==="I1"?"officer":"_other",[`لم يُختر عرضكم على الطلب ${a.ref}`,`Your offer on ${a.ref} was not selected`]); });
  move(a,"OFFER_SELECTED","",); a.selected=o.id; a.reveal=true;
  audit("pii.reveal",`${a.ref} → ${o.inst}`,"masked","revealed to selected institution only");
  if(o.inst==="I1") notify("officer",[`اختار المستفيد عرضكم على الطلب ${a.ref} — بيانات التواصل متاحة الآن`,`Your offer on ${a.ref} was selected — contact details unlocked`]);
  S.flags.selected=true;
}

  const steps=[L("نوع الحساب","Account type"),L("تأكيد الهاتف","Verify phone"),L("وثائق التحقق","KYC documents"),L("قيد المراجعة","Under review")];
  let body="";
  if(s.step===1) body=`
    <div class="form">
      <div class="field"><span class="flabel">${L("أسجّل بصفتي","I'm registering as")}</span>
        <div class="row">${[["beneficiary",L("مستفيد / رائد أعمال","Entrepreneur")],["institution",L("مؤسسة مالية","Financial institution")],["vendor",L("مزود خدمة — المرحلة 2","Service provider — phase 2")]].map(r=>`<button class="chip ${s.role===r[0]?"on":""}" data-act="su-role" data-v="${r[0]}" ${r[0]==="vendor"?"disabled":""}>${r[1]}</button>`).join("")}</div></div>
      <div class="f2">
        <div class="field"><label for="su-name">${s.role==="institution"?L("اسم المؤسسة","Institution name"):L("الاسم الكامل","Full name")}</label><input id="su-name" type="text" data-su="name" value="${esc(s.name)}" class="${s.err.name?"invalid":""}">${s.err.name?`<span class="err">${s.err.name}</span>`:""}</div>
        <div class="field"><label for="su-phone">${L("رقم الهاتف","Phone number")}</label><input id="su-phone" type="tel" dir="ltr" placeholder="+967 7XX XXX XXX" data-su="phone" value="${esc(s.phone)}" class="${s.err.phone?"invalid":""}">${s.err.phone?`<span class="err">${s.err.phone}</span>`:`<span class="hint">${L("سيصلك رمز تحقق لمرة واحدة","We'll send a one-time code")}</span>`}</div>
      </div>
      <div class="field"><span class="flabel">${L("أرسلوا الرمز عبر","Send the code by")}</span><div class="row">${[["wa",L("واتساب","WhatsApp")],["sms",L("رسالة SMS","SMS")]].map(c=>`<button class="chip ${(s.ch||"wa")===c[0]?"on":""}" data-act="su-ch" data-v="${c[0]}">${c[1]}</button>`).join("")}</div><span class="hint">${L("الرقم نفسه تصله لاحقاً إشعارات العروض والقرارات.","The same number will receive offer and decision messages.")}</span></div>
      <div class="row"><button class="btn btn-p" data-act="su-next">${L("إرسال رمز التحقق","Send code")}</button><span class="spec">§2 roles · OAuth/OTP</span></div>
    </div>`;
  if(s.step===2) body=`
    <div class="form">
      <div class="notice">${I("info")}<div>${L("رمز العرض التجريبي:","Demo code:")} <b class="mono">482193</b> — ${L("أُرسل عبر","sent by")} ${esc(T(CH[s.ch||"wa"]))} ${L("إلى","to")} <span dir="ltr">${esc(s.phone)}</span>. ${L("صالح 5 دقائق.","Valid for 5 minutes.")}</div></div>
      <div class="field" style="max-width:260px"><label for="su-otp">${L("رمز التحقق (6 أرقام)","6-digit code")}</label><input id="su-otp" type="text" inputmode="numeric" dir="ltr" maxlength="6" data-su="otp" value="${esc(s.otp)}" class="mono ${s.err.otp?"invalid":""}">${s.err.otp?`<span class="err">${s.err.otp}</span>`:""}</div>
      <div class="row"><button class="btn btn-p" data-act="su-next">${L("تأكيد","Verify")}</button><button class="btn btn-g" data-act="su-back">${L("رجوع","Back")}</button></div>
    </div>`;
  if(s.step===3){ const need=s.role==="institution"?[["lic",L("ترخيص البنك المركزي","Central Bank licence")],["reg",L("السجل التجاري","Commercial register")],["auth",L("تفويض المفوَّض بالتوقيع","Signatory authorisation")]]:[["id",L("البطاقة الشخصية (الوجهان)","National ID (both sides)")],["photo",L("صورة شخصية حديثة","Recent photo")],["res",L("إثبات السكن (اختياري)","Proof of residence (optional)")]];
    body=`<div class="form">
      ${need.map(([k,l])=>docSlot("su",k,l,s.docs[k])).join("")}
      ${s.err.docs?`<span class="err" style="color:var(--bad);font-size:13px">${s.err.docs}</span>`:""}
      <div class="notice">${I("lock")}<div>${L("تُخزَّن الوثائق مشفّرة في حاوية خاصة، وتُفتح فقط عبر رابط موقّع مؤقت لمراجع مخوّل، ويُسجَّل كل وصول.","Documents are encrypted in private storage, opened only via short-lived signed links by authorised reviewers, and every access is logged.")} ${spec("§9 KYC files")}</div></div>
      <div class="row"><button class="btn btn-p" data-act="su-next">${L("إرسال للمراجعة","Submit for review")}</button><button class="btn btn-g" data-act="su-back">${L("رجوع","Back")}</button></div></div>`; }
  if(s.step===4) body=`
    <div class="notice warn">${I("clock")}<div><b>${L("حسابك قيد مراجعة KYC","Your account is under KYC review")}</b><br>${L("يراجع موظف مخوّل وثائقك عادة خلال يوم عمل. لا يمكن نشر طلب تمويل أو تقديم عرض قبل الاعتماد.","An authorised reviewer usually decides within one working day. You can't publish a request or submit offers before approval.")} ${spec("REVIEW_PENDING")}</div></div>
    <div class="row"><button class="btn btn-g" data-act="go" data-role="kyc" data-view="kycq">${L("انتقل لدور مراجع KYC لاعتماده","Switch to the KYC reviewer to decide")}</button><button class="link" data-act="su-reset">${L("تسجيل حساب آخر","Register another")}</button></div>`;
  return head(L("إنشاء حساب","Create an account"),L("المرحلة الأولى: تسجيل برقم الهاتف وتحقق يدوي من الوثائق.","Phase 1: phone sign-up with manual document review."))+
    `<ol class="stepper">${steps.map((t,i)=>`<li class="${i+1<s.step?"done":""} ${i+1===s.step?"cur":""}">${t}</li>`).join("")}</ol><div class="card">${body}</div>`;
};
function docSlot(scope,k,label,val){
  return `<div class="drop ${val?"done":""}"><span>${I(val?"check":"file")}</span><div class="grow"><b style="font-size:14px">${esc(label)}</b><div class="sub">${val?`${esc(val.name)} · ${val.scan?L("فحص البرمجيات الضارة: سليم","Malware scan: clean"):L("جارٍ الفحص…","Scanning…")}`:L("PDF أو JPG أو PNG، حتى 10 ميغابايت","PDF, JPG or PNG, up to 10 MB")}</div></div>
    <input type="file" id="f-${scope}-${k}" data-file="${scope}:${k}" accept=".pdf,.jpg,.jpeg,.png" aria-label="${esc(label)}"><button class="btn btn-g btn-sm" data-act="sample-file" data-k="${scope}:${k}">${L("ملف تجريبي","Use sample")}</button></div>`;
}

  <div class="grid g3">${sample.map(v=>`<div class="card" style="opacity:.85"><div class="row" style="justify-content:space-between"><b style="font-family:var(--f-display)">${esc(T([v[0],v[1]]))}</b><span class="pill t-s">${L("معتمد","Verified")}</span></div><p class="sub" style="margin-top:6px">${esc(T(cats[v[2]]))}</p><dl class="kv" style="padding:8px 0 0"><dt>${L("نطاق السعر","Price range")}</dt><dd><span class="num">${v[3]}</span> ${L("ر.ي","YER")}</dd><dt>${L("مدة التنفيذ","Delivery")}</dt><dd>${L("5–15 يوماً","5–15 days")}</dd></dl><button class="btn btn-g btn-sm" disabled style="margin-top:10px;width:100%">${L("طلب عرض سعر — قريباً","Request quote — soon")}</button></div>`).join("")}</div>
  <div class="card"><div class="card-h"><h3>${L("دورة صفقة الخدمة","Service deal lifecycle")}</h3><span class="sub">${L("العمولة تُستحق عند التسوية بعد الإنجاز، لا عند القبول (افتراضياً 2%، قابلة للضبط)","Commission accrues on settlement after completion, not on acceptance (default 2%, configurable)")}</span></div>
  <div class="track">${flow.map((s,i)=>`<div class="st ${i<4?"done":""} ${i===4?"cur":""}">${s}</div>`).join("")}</div></div>`;
};

VIEWS.dash = () => {
  const mine=S.apps.filter(a=>a.owner==="me");
  const live=mine.filter(a=>!["CLOSED","CANCELLED","EXPIRED","REJECTED_AT_INTAKE","DECLINED_AFTER_SELECTION"].includes(a.status));
  const pend=S.offers.filter(o=>mine.some(a=>a.id===o.app && a.status==="OFFER_RECEIVED") && ["SUBMITTED","VIEWED"].includes(o.status));
  const funded=zoneSums(mine.filter(a=>["FUNDED","CLOSED"].includes(a.status)).map(a=>[a.zone,(S.offers.find(o=>o.id===a.selected)||{amount:0}).amount]));
  const next=mine.find(a=>a.status==="OFFER_RECEIVED");
  const sel=mine.find(a=>["OFFER_SELECTED","PRE_DISBURSEMENT"].includes(a.status));
  const notes=S.notifs.filter(n=>n.to==="beneficiary").slice(0,4);
  return head(L(`أهلاً ${S.me.name[0]}`,`Welcome, ${S.me.name[1]}`),L("حسابك معتمد ويمكنك تقديم طلبات تمويل.","Your account is verified; you can submit funding requests."),
    `${pill(KYC_ST,S.me.kyc)}<button class="btn btn-p" data-act="nav" data-view="new">${I("plus")}${L("طلب تمويل جديد","New request")}</button>`)+
  kpis([[L("طلبات نشطة","Active requests"),live.length],[L("عروض بانتظار قرارك","Offers awaiting you"),pend.length],[L("إجمالي ما مُوِّل عبر عُونة","Funded through Aouna"),`<span style="font-size:20px">${funded}</span>`]])+
  (next?`<div class="notice ok">${I("coins")}<div class="grow" style="flex:1"><b>${L(`لديك ${S.offers.filter(o=>o.app===next.id&&["SUBMITTED","VIEWED"].includes(o.status)).length} عروض على «${next.title[0]}»`,`${S.offers.filter(o=>o.app===next.id&&["SUBMITTED","VIEWED"].includes(o.status)).length} offers on “${next.title[1]}”`)}</b><br><span class="sub">${L("قارن القسط وإجمالي التكلفة قبل انتهاء صلاحية العروض.","Compare instalment and total cost before offers expire.")}</span></div><button class="btn btn-p btn-sm" data-act="open-app" data-id="${next.id}">${L("قارن العروض","Compare offers")}</button></div>`:"")+
  (sel?`<div class="notice gold">${I("check")}<div style="flex:1"><b>${L("اخترت عرضاً — الخطوة التالية لدى المؤسسة","Offer chosen — next step is with the lender")}</b><br><span class="sub">${esc(T(sel.title))}</span></div><button class="btn btn-g btn-sm" data-act="open-app" data-id="${sel.id}">${L("التفاصيل","Details")}</button></div>`:"")+
  `<div class="split"><div class="stack"><h2 style="font-size:17px">${L("طلباتي","My requests")}</h2>${appTable(mine)}</div>
   <div class="card"><div class="card-h"><h3>${L("آخر الإشعارات","Latest notifications")}</h3></div>${notes.map(n=>`<div class="lrow">${I("bell","faint")}<div class="grow" style="font-size:14px">${esc(T(n.t))}</div><span class="when">${ago(n.at)}</span></div>`).join("")||`<div class="empty">${L("لا إشعارات","Nothing yet")}</div>`}</div></div>`;
};
function appTable(list,admin){
  if(!list.length) return `<div class="empty">${L("لا توجد طلبات بعد. ابدأ بطلب تمويل جديد.","No requests yet. Start a new one.")}</div>`;
  return `<div class="tw"><table><thead><tr><th>${L("الطلب","Request")}</th>${admin?`<th>${L("المحافظة","Region")}</th>`:""}<th>${L("المبلغ","Amount")}</th><th>${L("العروض","Offers")}</th><th>${L("الحالة","Status")}</th><th>${L("أُنشئ","Created")}</th></tr></thead><tbody>
  ${list.map(a=>`<tr class="clickable" data-act="open-app" data-id="${a.id}" tabindex="0"><td><div class="t1">${esc(T(a.title))}</div><div class="t2 mono">${a.ref}</div></td>${admin?`<td>${esc(T(GOV[a.gov]))}</td>`:""}<td class="num">${fmt(a.amount)} <span class="t2">${curS(a.zone)}</span></td><td class="num">${S.offers.filter(o=>o.app===a.id&&o.status!=="WITHDRAWN").length}</td><td>${pill(APP_ST,a.status)}</td><td class="t2">${dt(a.created)}</td></tr>`).join("")}</tbody></table></div>`;
}
VIEWS.apps = () => head(L("طلباتي","My requests"),L("كل طلب يمر بحالات محددة؛ لا تتغير الحالة إلا عبر انتقال مسموح يُسجَّل في سجل التدقيق.","Each request moves through defined states; every transition is permitted and audited."),`<button class="btn btn-p" data-act="nav" data-view="new">${I("plus")}${L("طلب جديد","New request")}</button>`)+appTable(S.apps.filter(a=>a.owner==="me"));

VIEWS.app = () => {
  const a=app(S.sel); if(!a) return `<div class="empty">—</div>`;
  if(S.role==="admin") return adminAppView(a);
  if(a.owner!=="me") return `<div class="notice bad">${I("lock")}<div>403 — ${L("لا تملك صلاحية الوصول لهذا الطلب","You can't access this request")} ${spec("ABAC")}</div></div>`;
  // mark viewed (offer_events)
  let changed=false; S.offers.forEach(o=>{ if(o.app===a.id && o.status==="SUBMITTED" && a.status==="OFFER_RECEIVED"){ o.status="VIEWED"; changed=true; audit("offer.viewed",`Offer ${o.id}`,"SUBMITTED","VIEWED","","beneficiary"); } }); if(changed) save();
  const offers=S.offers.filter(o=>o.app===a.id && o.status!=="WITHDRAWN").sort((x,y)=>new Date(x.created)-new Date(y.created));
  const qs=offers.map(o=>({o,q:quote(o)}));
  const live=qs.filter(x=>["SUBMITTED","VIEWED","SELECTED"].includes(x.o.status));
  const minCost=Math.min(...live.map(x=>x.q.cost)), maxAmt=Math.max(...live.map(x=>x.o.amount)), minInst=Math.min(...live.map(x=>x.q.inst));
  const canSelect=a.status==="OFFER_RECEIVED";
  const selO=offers.find(o=>o.status==="SELECTED");
  const canCancel=["DRAFT","NEEDS_INFO","PUBLISHED","OFFER_RECEIVED"].includes(a.status);
  return head(esc(T(a.title)),`<span class="mono">${a.ref}</span> · ${esc(T(SEC[a.sector]))} · ${esc(T(GOV[a.gov]))} · <span class="chip">${zoneName(a.zone)}</span>`,
    `${pill(APP_ST,a.status)}${canCancel?`<button class="btn btn-d btn-sm" data-act="cancel-app" data-id="${a.id}">${L("إلغاء الطلب","Cancel request")}</button>`:""}`,
    `<button data-act="nav" data-view="apps">${L("طلباتي","My requests")}</button> / <span class="mono">${a.ref}</span>`)+
  `<div class="card">${track(a)} <div style="margin-top:8px">${spec("§4.1 state machine · "+a.status)}</div></div>`+
  (selO?selectedPanel(a,selO):"")+
  (offers.length?`<section class="stack"><div class="row" style="justify-content:space-between"><h2 style="font-size:18px">${L("مقارنة العروض","Compare offers")}</h2><span class="sub">${L("القسط وعدد الأقساط والرسوم كما أعلنتها كل مؤسسة بطريقتها؛ المنصة تجمعها فقط لتسهيل المقارنة.","Instalment, term and fees as each lender declared them; the platform only adds them up.")} ${spec("v2.1 §7 declared terms")}</span></div>
   <div class="offers">${qs.map((x,i)=>offerCard(a,x,i,{minCost,maxAmt,minInst,canSelect})).join("")}</div>
   ${(()=>{ const ts=live.map(x=>+x.o.term); return ts.length>1&&Math.max(...ts)-Math.min(...ts)>6?`<div class="notice warn">${I("info")}<div>${L("مدد العروض مختلفة كثيراً: العرض الأقل تكلفة قد يكون بقسط شهري أعلى. قارن القسط مع إجمالي التكلفة.","Offer terms differ widely: the lowest-cost offer may carry a higher instalment. Compare both.")}</div></div>`:""; })()}
   ${canSelect?`<p class="sub">${L("هوية المؤسسات مخفية حتى تختار؛ هذا يجعل المقارنة على الشروط وحدها.","Lender names stay hidden until you choose, so you compare on terms alone.")}</p>`:""}</section>`
  :(["PUBLISHED"].includes(a.status)?`<div class="notice">${I("clock")}<div><b>${L("طلبك منشور للمؤسسات المطابقة","Published to matching lenders")}</b><br><span class="sub">${L(`وصل إلى ${S.institutions.filter(i=>matches(a,i)).length} مؤسسات. ستصلك العروض هنا وفي الإشعارات. صلاحية الطلب حتى ${dt(a.expires)}.`,`Reached ${S.institutions.filter(i=>matches(a,i)).length} lenders. Offers will appear here. Valid until ${dt(a.expires)}.`)}</span></div></div>`:""))+
  `<div class="grid g2">
    <div class="card"><div class="card-h"><h3>${L("تفاصيل الطلب","Request details")}</h3></div>
      <dl class="kv" style="padding:0"><dt>${L("المبلغ المطلوب","Amount")}</dt><dd>${money(a.amount,a.zone)}</dd><dt>${L("المدة","Term")}</dt><dd>${a.term} ${L("شهراً","months")}</dd><dt>${L("فترة السماح المطلوبة","Grace requested")}</dt><dd>${a.grace} ${L("شهر","mo")}</dd><dt>${L("مرحلة المشروع","Stage")}</dt><dd>${a.stage==="idea"?L("فكرة","Idea"):L("قائم","Operating")}</dd><dt>${L("الغرض","Purpose")}</dt><dd>${esc(T(a.purpose))}</dd><dt>${L("صالح حتى","Valid until")}</dt><dd>${dt(a.expires)}</dd></dl>
      <p class="sub" style="margin-top:10px">${esc(T(a.desc))}</p></div>
    <div class="card"><div class="card-h"><h3>${L("الضمانة والمستندات","Guarantee & documents")}</h3>${spec("guarantor PII hidden from lenders")}</div>
      <p class="sub" style="margin-bottom:6px">${guarantorNote(a)}</p>
      ${(a.guarantors||[]).filter(g=>g.name).map(g=>`<div class="lrow">${I("user","faint")}<div class="grow"><div style="font-size:14px">${esc(g.name)}</div><div class="sub" dir="ltr" style="text-align:start">${esc(g.phone)}</div></div>${g.consent==="CONSENTED"?`<span class="pill t-s">${L("وافق","Consented")}</span>`:`<span class="pill t-w">${L("بانتظار الموافقة","Awaiting consent")}</span>`}</div>`).join("")}
      ${(a.docs||[]).map(d=>`<div class="lrow">${I("file","faint")}<div class="grow" style="font-size:14px">${esc(T(d))}</div><span class="pill t-s">${L("سليم","Clean")}</span></div>`).join("")}</div>
  </div>`;
};
function offerCard(a,x,i,m){
  const {o,q}=x; const isSel=o.status==="SELECTED"; const dim=o.status==="DECLINED";
  const tags=[]; if(!dim && ["SUBMITTED","VIEWED","SELECTED"].includes(o.status)){ if(q.cost===m.minCost) tags.push(`<span class="chip on">${L("الأقل تكلفة","Lowest cost")}</span>`); if(q.inst===m.minInst) tags.push(`<span class="chip">${L("أقل قسط","Lowest instalment")}</span>`); if(o.amount===m.maxAmt && o.amount>=a.amount) tags.push(`<span class="chip">${L("المبلغ كاملاً","Full amount")}</span>`); else if(o.amount<a.amount) tags.push(`<span class="chip">${L("مبلغ أقل من المطلوب","Below requested")}</span>`); }
  const dl=daysLeft(o.expires);
  const name = a.reveal && isSel ? esc(T(inst(o.inst).name)) : `${I("lock")} ${L("مؤسسة مخفية","Lender hidden")}`;
  return `<article class="offer ${q.cost===m.minCost&&!dim?"best":""} ${isSel?"sel":""} ${dim?"dim":""}">
    <div class="offer-h"><div><b>${L("العرض","Offer")} ${AR()?LET[i]:LETE[i]}</b><div class="offer-inst row" style="gap:4px">${name}</div></div>${pill(OF_ST,o.status)}</div>
    <div class="offer-big"><div class="lbl">${L("القسط الشهري","Monthly instalment")}</div><div class="val">${money(q.inst,a.zone)}</div></div>
    <div class="offer-tags">${tags.join("")}</div>
    <dl class="kv">
      <dt>${L("المبلغ الممنوح","Amount offered")}</dt><dd>${fmt(o.amount)}</dd>
      <dt>${L("المدة / السماح","Term / grace")}</dt><dd>${o.term} / ${o.grace} ${L("شهر","mo")}</dd>

function validateDraft(d,step){
  const e={};
  if(step===1){ if((d.title||"").trim().length<4) e.title=L("اكتب اسماً واضحاً للمشروع (4 أحرف على الأقل)","Enter a clear name (4+ characters)"); if(!d.sector) e.sector=L("اختر القطاع","Choose a sector"); if(!d.gov) e.gov=L("اختر المحافظة","Choose a governorate"); if((d.desc||"").trim().length<20) e.desc=L("صف المشروع في 20 حرفاً على الأقل لتفهمه المؤسسات","Describe the project in at least 20 characters"); }
  if(step===2){ const a=+d.amount; if(!a||a<100000||a>20000000) e.amount=L("أدخل مبلغاً بين 100,000 و20,000,000 ريال","Enter 100,000 – 20,000,000 YER"); if((d.purpose||"").trim().length<4) e.purpose=L("اذكر كيف ستستخدم التمويل","Say how you'll use the funds"); }
  if(step===3){ const ok=d.guarantors.filter(g=>g.name.trim().length>2 && g.phone.replace(/\D/g,"").length>=9).length; if(d.gtype==="takaful"&&ok<2) e.g=L("أدخل اسم ورقم هاتف عضوين على الأقل","Enter name and phone for at least two members"); if(d.gtype==="personal"&&ok<1) e.g=L("أدخل اسم ورقم هاتف الضامن","Enter the guarantor's name and phone"); }
  if(step===4){ if(!d.docs.plan) e.docs=L("خطة المشروع مطلوبة","The business plan is required"); }
  if(step===5){ if(!d.consent) e.consent=L("الموافقة مطلوبة لنشر الطلب","Consent is required to publish"); }
  return e;
}

    if(matches(a,inst("I1"))) notify("officer",[`طلب جديد مطابق لسياستكم: ${a.ref} · ${T(SEC[a.sector])} · ${moneyTxt(a.amount,a.zone)}`,`New matching request: ${a.ref} · ${moneyTxt(a.amount,a.zone)}`]);
    a.guarantors.forEach(g=>{ sendMsg("guarantor",[`${S.me.name[0]} تطلب موافقتك ضامناً — افتح الرابط للموافقة أو الرفض`,`${S.me.name[1]} asks you to be a guarantor — open the link to respond`]); });
    if(a.guarantors.length) setTimeout(()=>{ const x=app(id); if(!x) return; x.guarantors.forEach(g=>g.consent="CONSENTED"); audit("guarantor.consent",x.ref,"PENDING","CONSENTED","via signed link","system"); notify("beneficiary",[`وافق جميع الضامنين على طلبك ${x.ref}`,`All guarantors consented on ${x.ref}`]); save(); if(!S.modal) render(); else renderTop(); },4000);
    save();
    // simulate a competing offer from another lender (async, as in production)
    setTimeout(()=>autoCompetitor(id),6000);
    openModal({type:"intake",id,n,checks:[L("اكتمال الحقول الإلزامية","Required fields complete"),L("حساب المستفيد معتمد (KYC)","Applicant verified (KYC)"),L("فحص الملفات: سليمة","Files scanned: clean"),L("إزالة البيانات التعريفية من النسخة المنشورة","Identifying data removed from published copy"),L(`مطابقة المؤسسات: ${n}`,`Lenders matched: ${n}`),L("إشعار المؤسسات المطابقة والضامنين عبر واتساب","Matching lenders and guarantors notified by WhatsApp")]});
    render(); },

  /* select offer */
  "ask-select":(d)=>openModal({type:"select",id:d.id}),
  "do-select":(d)=>{ if(act(()=>srvSelectOffer(d.id))){ closeModal(); toast(L("تم اختيار العرض وإبلاغ المؤسسة","Offer chosen and lender notified"),"gold"); window.scrollTo(0,0);} },
  "cancel-app":(d)=>act(()=>{ const a=app(d.id); move(a,"CANCELLED","by beneficiary"); S.offers.filter(o=>o.app===a.id&&["SUBMITTED","VIEWED"].includes(o.status)).forEach(o=>o.status="DECLINED"); toast(L("أُلغي الطلب","Request cancelled")); }),

  /* officer */
  "of-submit":(d)=>{ const a=app(d.id); const f=S.uiTab.of; const I1=inst("I1"); const errs=[];
    if(!(+f.amount>0)) errs.push(L("أدخل المبلغ","Enter amount")); if(+f.amount>I1.policy.lim[a.zone][1]) errs.push(L("المبلغ يتجاوز سقف سياستكم","Above your policy cap")); if(+f.amount>a.amount) errs.push(L("لا يتجاوز العرض المبلغ المطلوب","Can't exceed the requested amount"));
    if(!(+f.pay>0)) errs.push(L("أدخل القسط الشهري","Enter the monthly instalment")); else if(+f.pay*((+f.term)-(+f.grace))<+f.amount) errs.push(L("مجموع الأقساط أقل من المبلغ الممنوح — راجع القسط","Instalments total less than the amount — check the instalment")); if(!(+f.term>=3&&+f.term<=60)) errs.push(L("المدة بين 3 و60 شهراً","Term 3–60 months")); if(+f.grace>=+f.term) errs.push(L("فترة السماح أقل من المدة","Grace must be shorter than term")); if(!f.reviewed) errs.push(L("أكّد المراجعة الداخلية","Confirm internal review"));
    if(errs.length){ toast(errs.join(" · "),"bad"); return; }
    act(()=>{ if(S.offers.some(o=>o.app===a.id&&o.inst==="I1"&&o.status!=="WITHDRAWN")) throw new Error(L("لديكم عرض قائم على هذا الطلب","You already have an offer here"));
      const o={id:rid("O",4),app:a.id,inst:"I1",amount:+f.amount,method:"custom",rate:0,pay:+f.pay,mlabel:[f.mlabel,f.mlabel],term:+f.term,fees:+f.fees,grace:+f.grace,docs:[f.docs||"—",f.docs||"—"],status:"SUBMITTED",created:nowISO(),expires:nowISO((+f.valid||7)*1440),by:"U11"};
      S.offers.push(o); audit("offer.submit",`Offer ${o.id} → ${a.ref}`,"DRAFT","SUBMITTED");
      if(a.status==="PUBLISHED") move(a,"OFFER_RECEIVED","","system");
      if(a.owner==="me"){ notify("beneficiary",[`وصل عرض جديد على طلبك ${a.ref}`,`New offer on ${a.ref}`]); if(a.isNew) S.flags.offerOnNew=true; }
      S.uiTab.of=null; toast(L("أُرسل العرض للمستفيد","Offer sent"));
    }); },
  "of-withdraw":(d)=>act(()=>{ const o=S.offers.find(x=>x.id===d.id); if(!["SUBMITTED","VIEWED"].includes(o.status)) throw new Error("409"); o.status="WITHDRAWN"; audit("offer.withdraw",`Offer ${o.id}`,"SUBMITTED","WITHDRAWN"); const a=app(o.app); if(a.status==="OFFER_RECEIVED"&&!S.offers.some(x=>x.app===a.id&&["SUBMITTED","VIEWED"].includes(x.status))) move(a,"PUBLISHED","no active offers","system"); toast(L("سُحب العرض","Offer withdrawn")); }),
  disb:(d)=>act(()=>{ const a=app(d.id); move(a,d.to); if(d.to==="FUNDED"){ const o=S.offers.find(x=>x.id===a.selected); S.invSeq++; const amt=Math.round(o.amount*S.settings.perfFee/100); const id=`INV-2026-00${S.invSeq}`; S.invoices.unshift({id,inst:o.inst,zone:a.zone,kind:"perf",desc:[`رسوم أداء ${S.settings.perfFee}% — الطلب ${a.ref}`,`${S.settings.perfFee}% performance fee — ${a.ref}`],amount:amt,status:"ISSUED",issued:nowISO(),due:nowISO(14*1440)}); audit("invoice.issue",id,"—","ISSUED",`${S.settings.perfFee}% of ${o.amount}`,"system"); notify("manager",[`فاتورة جديدة ${id} بقيمة ${moneyTxt(amt,a.zone)}`,`New invoice ${id}: ${moneyTxt(amt,a.zone)}`]); if(a.owner==="me") notify("beneficiary",[`أكدت المؤسسة صرف تمويل طلبك ${a.ref}`,`Disbursement confirmed for ${a.ref}`]); S.flags.funded=true; toast(L("سُجّل الصرف وأُصدرت فاتورة رسوم الأداء","Disbursement recorded; fee invoice issued"),"gold"); } else toast(L("بدأت إجراءات ما قبل الصرف","Pre-disbursement started")); }),
  "ask-decline":(d)=>openModal({type:"decline",id:d.id}),
  "do-decline":(d)=>{ const r=$("#dec-reason").value; if(!r){ $("#dec-err").textContent=L("اختر السبب","Choose a reason"); return; } if(act(()=>{ const a=app(d.id); move(a,"DECLINED_AFTER_SELECTION",r); a.declineReason=r; if(a.owner==="me") notify("beneficiary",[`اعتذرت المؤسسة عن طلبك ${a.ref}: ${r}`,`Lender declined ${a.ref}: ${r}`]); })) closeModal(); },

  /* manager */
  "inv-send":()=>{ const v=S.uiTab.inv||{name:"",email:"",err:{}}; v.err={}; if(v.name.trim().length<3) v.err.name=L("أدخل الاسم","Enter a name"); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) v.err.email=L("أدخل بريداً صحيحاً","Enter a valid email"); if(String(v.phone||"").replace(/\D/g,"").length<9) v.err.phone=L("أدخل رقم جوال صحيحاً","Enter a valid mobile number"); S.uiTab.inv=v; if(Object.keys(v.err).length){ render(); return; }
    act(()=>{ if(S.officers.filter(o=>o.status!=="DISABLED").length>=S.settings.seats) throw new Error(L("بلغتم سقف المقاعد","Seat cap reached")); S.officers.push({id:rid("U",3),name:[v.name,v.name],email:v.email,status:"INVITED",last:null,offers:0}); sendMsg("invitee",["دعوة للانضمام إلى فريق مؤسسة النماء على عُونة — رابط تفعيل صالح 48 ساعة","Invitation to join Al-Namaa on Aouna — 48h activation link"]); audit("member.invite",v.email,"—","INVITED"); S.uiTab.inv=null; toast(L("أُرسلت الدعوة","Invite sent")); }); },
  "off-disable":(d)=>act(()=>{ const o=S.officers.find(x=>x.id===d.id); o.status="DISABLED"; audit("member.disable",o.email,"ACTIVE","DISABLED"); toast(L("عُطّل الحساب وأُنهيت جلساته","Account disabled and sessions revoked")); }),
  "pol-tog":(d)=>{ const p=S.uiTab.pol; const arr=p[d.f]; const i=arr.indexOf(d.v); if(i>=0){ if(arr.length>1) arr.splice(i,1); else toast(L("اختر عنصراً واحداً على الأقل","Keep at least one"),"bad"); } else arr.push(d.v); render(); },
  "pol-save":()=>act(()=>{ const p=S.uiTab.pol; if(["new","old"].some(z=>p.lim[z]&&+p.lim[z][0]>=+p.lim[z][1])) throw new Error(L("الحد الأدنى يجب أن يكون أقل من الأعلى","Minimum must be below maximum")); const before=JSON.stringify(inst("I1").policy).length; inst("I1").policy=JSON.parse(JSON.stringify(p)); audit("policy.update","I1 eligibility_rules","v"+before,"updated"); toast(L("حُفظت السياسة وتحدّثت قائمة الطلبات","Policy saved; queue updated")); }),
  pay:(d)=>openModal({type:"pay",id:d.id,p:null}),
  "pay-p":(d)=>{ S.modal.p=d.v; renderModal(); },
  "pay-go":(d)=>payFlow(d.id),

  /* kyc */
  "kyc-dec":(d)=>{ const k=S.kyc.find(x=>x.id===d.id); const c=S.uiTab["kc"+k.id]; c.err="";
    if(d.d!=="ACTIVE" && c.reason.trim().length<5){ c.err=L("اكتب سبباً واضحاً (5 أحرف على الأقل)","Write a clear reason (5+ characters)"); render(); $("#kc-reason").focus(); return; }
    if(d.d==="ACTIVE" && !c.chk.every(Boolean)) return;
    act(()=>{ const from=k.status; k.status=d.d; k.note=c.reason; audit("kyc.decision",`KYC ${k.id}`,from,d.d,c.reason); if(k.type==="institution"&&d.d==="ACTIVE") notify("admin",[`اكتمل KYC لـ ${k.name} — يمكن اعتماد المؤسسة`,`KYC done for ${k.nameEn}`]); toast(d.d==="ACTIVE"?L("اعتُمد الحساب","Approved"):d.d==="REJECTED"?L("رُفضت الحالة وأُبلغ المتقدم بالسبب","Rejected; applicant told why"):L("طُلب الاستكمال من المتقدم","Info requested")); S.view="kycq"; }); },

  /* admin */
  "inst-dec":(d)=>{ if(d.d==="REJECTED") return openModal({type:"inst-reject",id:d.id}); act(()=>{ const i=inst(d.id); i.status="ACTIVE"; S.invSeq++; S.invoices.unshift({id:`INV-2026-00${S.invSeq}`,inst:i.id,zone:"new",kind:"sub",desc:["اشتراك سنوي — الخطة الأساسية","Annual plan — Basic"],amount:S.settings.subFee,status:"ISSUED",issued:nowISO(),due:nowISO(14*1440)}); audit("institution.approve",T(i.name),"PENDING_APPROVAL","ACTIVE"); toast(L("اعتُمدت المؤسسة وأُصدرت فاتورة الاشتراك","Approved; plan invoice issued")); }); },
  "do-inst-reject":(d)=>{ const r=$("#ir-reason").value.trim(); if(r.length<5){ $("#ir-err").textContent=L("اكتب السبب","Write a reason"); return; } if(act(()=>{ const i=inst(d.id); i.status="REJECTED"; audit("institution.reject",T(i.name),"PENDING_APPROVAL","REJECTED",r); })) closeModal(); },
  "ask-resolve":(d)=>openModal({type:"resolve",id:d.id}),
  "do-resolve":(d)=>{ const r=$("#res-reason").value.trim(); if(r.length<8){ $("#res-err").textContent=L("اكتب السبب ومرجع المزود","Enter reason and provider reference"); return; } if(act(()=>{ const t=S.txns.find(x=>x.id===d.id); t.recon="RESOLVED"; audit("recon.manual_resolve",t.id,"NEEDS_REVIEW","RESOLVED",r); toast(L("سُجّلت التسوية اليدوية","Manual resolution recorded")); })) closeModal(); },
  "close-app":(d)=>act(()=>{ move(app(d.id),"CLOSED","admin close"); }),
  "set-save":()=>act(()=>{ const s=S.uiTab.set; const ch=Object.keys(s).filter(k=>+s[k]!==S.settings[k]); if(+s.perfFee<0||+s.perfFee>10) throw new Error(L("رسوم الأداء بين 0 و10%","Fee must be 0–10%")); if(+s.seats<1) throw new Error("seats ≥ 1"); ch.forEach(k=>{ audit("settings.update",k,String(S.settings[k]),String(s[k])); S.settings[k]=+s[k]; }); S.uiTab.set=null; toast(ch.length?L("حُفظت الإعدادات","Settings saved"):L("لا تغييرات","No changes")); }),
  "sample-file":(d)=>{ const [scope,k]=d.k.split(":"); setDoc(scope,k,{name:L("ملف تجريبي.pdf","sample.pdf"),size:240000}); },
  "tk-send":()=>{ const s=S.uiTab.ticket||{subject:"",cat:"offers",msg:"",err:{}}; s.err={}; if(s.subject.trim().length<4) s.err.subject=L("اكتب موضوعاً واضحاً","Enter a subject"); S.uiTab.ticket=s; if(Object.keys(s.err).length){ render(); return; } act(()=>{ S.tickets.unshift({id:rid("T-",4),subject:[s.subject,s.subject],cat:s.cat==="kyc"?["التحقق والحساب","Account & KYC"]:s.cat==="complaint"?["شكوى على مؤسسة","Complaint"]:["العروض","Offers"],status:"OPEN",at:nowISO()}); S.uiTab.ticket=null; toast(L("أُنشئت التذكرة","Ticket created")); }); }
};

function setDoc(scope,k,file){
  const okExt=/\.(pdf|jpe?g|png)$/i.test(file.name);
  if(!okExt){ toast(L("نوع الملف غير مسموح. استخدم PDF أو JPG أو PNG.","File type not allowed. Use PDF, JPG or PNG."),"bad"); return; }
  if(file.size>10*1024*1024){ toast(L("الملف أكبر من 10 ميغابايت","File exceeds 10 MB"),"bad"); return; }
  const target = scope==="su" ? S.signup.docs : S.draft.docs;
  target[k]={name:file.name,scan:false}; render();
  setTimeout(()=>{ if(target[k]){ target[k].scan=true; save(); render(); } },700);
}

function autoCompetitor(appId){
  const a=app(appId); if(!a || !["PUBLISHED","OFFER_RECEIVED"].includes(a.status)) return;
  const cand=["I2","I3"].map(inst).find(i=>matches(a,i) && !S.offers.some(o=>o.app===a.id&&o.inst===i.id));
  if(!cand) return;
  const o={id:rid("O",4),app:a.id,inst:cand.id,amount:a.amount,method:"murabaha",rate:cand.id==="I2"?13:11.5,term:a.term,fees:cand.id==="I2"?30000:45000,grace:Math.min(1,a.grace),docs:["كشف مبيعات 3 أشهر","3-month sales record"],status:"SUBMITTED",created:nowISO(),expires:nowISO(S.settings.offerDays*1440),by:"—"};
  o.pay=Math.round(legacyInst(o)/100)*100; o.mlabel=METHOD.murabaha;
  S.offers.push(o); audit("offer.submit",`Offer ${o.id} → ${a.ref}`,"DRAFT","SUBMITTED","",'system');
  if(a.status==="PUBLISHED"){ a.status="OFFER_RECEIVED"; audit("application.transition",a.ref,"PUBLISHED","OFFER_RECEIVED","","system"); }
  notify("beneficiary",[`وصل عرض جديد على طلبك ${a.ref}`,`New offer on ${a.ref}`]);
  save(); if(S.role==="beneficiary"){ toast(L("وصل عرض جديد على طلبك","A new offer arrived"),"gold"); } if(!S.modal) render(); else renderTop();
}

function payFlow(invId){
  const m=S.modal; const inv=S.invoices.find(i=>i.id===invId); const prov=m.p==="A"?["محفظة تجريبية (أ)","Sandbox wallet A"]:["بنك تجريبي (ب)","Sandbox bank B"];
  const pi="PI-"+Math.random().toString(16).slice(2,8).toUpperCase(), tx="TX-"+Math.random().toString(16).slice(2,8).toUpperCase(), idem="idem_"+Math.random().toString(16).slice(2,10);
  const ts=()=>new Date().toISOString().slice(11,19);
  const log=(t,c)=>{ m.log.push([`${ts()}  ${t}`,c||""]); S.payLog.push([`${ts()}  ${t}`,c||""]); renderModal(); };
  m.stage="wait"; m.log=[]; inv.status="PROCESSING";
  log(`POST /payments/intents  ${pi}  amount=${inv.amount} ${inv.zone==="old"?"YER_OLD":"YER_NEW"}  ${idem}`);
  log(`adapter=${m.p==="A"?"wallet_a":"bank_b"}  status=REQUIRES_CUSTOMER_ACTION`);
  audit("payment.intent_created",pi,"—","REQUIRES_ACTION",inv.id);
  setTimeout(()=>{ log(`webhook received  event=payment.succeeded  ref=${inv.id}`); },1100);
  setTimeout(()=>{ log(`✓ HMAC signature valid   ✓ amount ${inv.amount}   ✓ currency ${inv.zone==="old"?"YER_OLD":"YER_NEW"}   ✓ ref ${inv.id}`,"okc"); },1700);
  setTimeout(()=>{ inv.status="PAID"; inv.paidAt=nowISO(); S.txns.unshift({id:tx,inv:inv.id,provider:prov,amount:inv.amount,status:"SUCCEEDED",recon:"MATCHED",at:nowISO()}); audit("payment.succeeded",tx,"PROCESSING","PAID",`via ${prov[1]}`,"system"); log(`${tx} SUCCEEDED → invoice ${inv.id} PAID → reconciliation MATCHED`,"okc"); S.flags.paid=true; save(); },2300);
  setTimeout(()=>{ log(`webhook received again (replay)  ref=${inv.id}`,"wc"); log(`✗ duplicate event ignored (idempotency key seen)`,"bad"); audit("webhook.duplicate_ignored",tx,"—","ignored","replay","system"); m.stage="done"; save(); renderModal(); toast(L("تم الدفع وتأكيده من المزود","Payment confirmed by provider"),"gold"); },3200);
  renderModal();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const fn=A[el.dataset.act]; if(!fn) return;
  if(el.dataset.act==="scrim"){ fn(el.dataset,el,e); return; }
  e.preventDefault(); fn(el.dataset,el,e);
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.modal) closeModal();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("tr[data-act]")){ e.preventDefault(); A[e.target.dataset.act](e.target.dataset); }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.change==="persona"){ A.go({role:t.value}); return; }
  if(t.dataset.file){ const [scope,k]=t.dataset.file.split(":"); const f=t.files&&t.files[0]; if(f) setDoc(scope,k,{name:f.name,size:f.size}); return; }
  if(t.dataset.kc){ const c=S.uiTab["kc"+t.dataset.kc]; c.chk[+t.dataset.i]=t.checked; render(); return; }
  if(t.dataset.bind){ bind(t); if(t.tagName==="SELECT"||t.type==="checkbox") save(); }
  if(t.dataset.of){ ofBind(t); if(t.dataset.of==="method") render(); }
  if(t.dataset.tk){ S.uiTab.ticket=S.uiTab.ticket||{subject:"",cat:"offers",msg:"",err:{}}; S.uiTab.ticket[t.dataset.tk]=t.value; }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.bind) { bind(t); save(); }
  if(t.dataset.su){ S.signup[t.dataset.su]=t.value; }
  if(t.dataset.of) ofBind(t);
  if(t.dataset.inv){ S.uiTab.inv=S.uiTab.inv||{name:"",email:"",err:{}}; S.uiTab.inv[t.dataset.inv]=t.value; }
  if(t.dataset.pol){ const [z,i]=t.dataset.pol.split("."); const p=S.uiTab.pol; p.lim[z]=p.lim[z]||[0,0]; p.lim[z][+i]=+t.value; }
  if(t.dataset.set){ S.uiTab.set[t.dataset.set]=t.value; }
  if(t.dataset.kcr){ S.uiTab["kc"+t.dataset.kcr].reason=t.value; }
  if(t.dataset.tk){ S.uiTab.ticket=S.uiTab.ticket||{subject:"",cat:"offers",msg:"",err:{}}; S.uiTab.ticket[t.dataset.tk]=t.value; }
});
function bind(t){ const d=S.draft; const k=t.dataset.bind; const v=t.type==="checkbox"?t.checked:t.value;
  if(k.startsWith("g.")){ const [,i,f]=k.split("."); d.guarantors[+i][f]=v; } else d[k]=v;
  if(k==="gov"){ d.zone=GOV_ZONE[v]; setTimeout(render,0); }
  if(d.err&&d.err[k]){ delete d.err[k]; t.classList.remove("invalid"); const er=t.parentElement.querySelector(".err"); if(er) er.remove(); } }
function ofBind(t){ const f=S.uiTab.of; f[t.dataset.of]=t.type==="checkbox"?t.checked:t.value; const p=$("#of-preview"); if(p) p.innerHTML=previewKpis(quote(f)); }

/* ---------- boot ---------- */
S=load(); S.modal=null;
render();
let heroPaused=0;
const reduceMotion=(()=>{ try{ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } })();
if(!reduceMotion) setInterval(()=>{ if(document.hidden || Date.now()-heroPaused<12000) return; if(document.getElementById("hero-slides")) showSlide(heroIdx+1); },6500);
})();
</script>
